[package]
name = "treehouse"
version = "0.14.0"
description = "Agentic development environment (ADE) with parallel worktree agents"
authors = ["Kyle Walters"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "treehouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for multi-webview (`Window::add_child`) — the preview browser.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "fs"] }
parking_lot = "0.12"
git2 = { version = "0.19", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
ulid = { version = "1", features = ["serde"] }
dashmap = "6"
notify-debouncer-full = "0.3"
ignore = "0.4"
portable-pty = "0.8"
bytes = "1"
dunce = "1"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
# Typed Agent Client Protocol messages for ACP-transport agents (agent::acp).
# Schema only — the JSON-RPC framing is ours (tokio, ndjson over stdio).
agent-client-protocol-schema = { version = "1.10", default-features = false }
# Image files attached to ACP prompts go as base64 image blocks.
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
